
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #2b1d31;
            --cake-color: #f7d2bc;
            --icing-color: #ff9fb2;
            --chocolate-color: #5c3a21;
            --plate-color: #e0e0e0;
            --candle-color: #fffbdd;
            --flame-color: #ffb703;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Fredoka One', cursive;
            overflow: hidden;
            transition: background-color 1s ease;
        }

        /* Lights on state */
        body.party-mode {
            background-color: #ffe8f2;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }

        /* The Cake */
        .cake-wrapper {
            position: relative;
            width: 300px;
            height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .cake-wrapper:hover {
            transform: scale(1.02);
        }

        .plate {
            width: 340px;
            height: 20px;
            background: var(--plate-color);
            border-radius: 50%;
            position: absolute;
            bottom: -10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 0;
        }

        .tier {
            position: relative;
            background: var(--cake-color);
            border-radius: 12px;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.1);
        }

        .tier::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: var(--icing-color);
            border-radius: 12px 12px 10px 10px;
        }

        /* Chocolate filling */
        .tier::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 8px;
            background: var(--chocolate-color);
            opacity: 0.8;
        }

        .tier-bottom {
            width: 260px;
            height: 80px;
            z-index: 1;
        }

        .tier-middle {
            width: 200px;
            height: 70px;
            z-index: 2;
            margin-bottom: -5px;
        }

        .tier-top {
            width: 140px;
            height: 60px;
            z-index: 3;
            margin-bottom: -5px;
        }

        /* Drips */
        .drips {
            position: absolute;
            top: 30px;
            width: 100%;
            display: flex;
            justify-content: space-around;
        }

        .drip {
            width: 16px;
            height: 30px;
            background: var(--icing-color);
            border-radius: 20px;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.1);
        }

        .drip:nth-child(even) {
            height: 45px;
            transform: translateY(-5px);
        }
        
        .drip:nth-child(3n) {
            height: 20px;
            transform: translateY(-10px);
        }

        /* Candles */
        .candles {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: absolute;
            top: 15px;
            z-index: 3;
            width: 100%;
        }

        .candle {
            width: 12px;
            height: 40px;
            background: repeating-linear-gradient(
                -45deg,
                #fff,
                #fff 5px,
                #ff7b93 5px,
                #ff7b93 10px
            );
            border-radius: 4px;
            position: relative;
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.1);
        }

        /* Candle Wicks */
        .candle::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 5px;
            width: 2px;
            height: 5px;
            background: #333;
        }

        .flame {
            position: absolute;
            top: -22px;
            left: 1px;
            width: 10px;
            height: 20px;
            background: var(--flame-color);
            border-radius: 50% 50% 20% 20% / 60% 60% 30% 30%;
            transform-origin: bottom center;
            animation: flicker 0.6s infinite alternate;
            box-shadow: 0 0 15px 5px rgba(255, 183, 3, 0.6);
            transition: opacity 0.5s ease;
        }

        /* Make each flame flicker slightly out of sync */
        .candle:nth-child(1) .flame { animation-delay: 0.1s; }
        .candle:nth-child(2) .flame { animation-delay: 0.3s; }
        .candle:nth-child(3) .flame { animation-delay: 0.5s; }
        .candle:nth-child(4) .flame { animation-delay: 0.2s; }
        .candle:nth-child(5) .flame { animation-delay: 0.4s; }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-3deg); opacity: 0.9; }
            50% { transform: scale(1.1) rotate(2deg); opacity: 1; }
            100% { transform: scale(0.95) rotate(-1deg); opacity: 0.8; background: #ffea00; }
        }

        .flame.blown-out {
            opacity: 0;
            animation: none;
            box-shadow: none;
        }

        /* Smoke effect */
        .smoke {
            position: absolute;
            top: -25px;
            left: 3px;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            opacity: 0;
            filter: blur(2px);
        }

        .candle.blown .smoke {
            animation: riseSmoke 2s ease-out forwards;
        }

        @keyframes riseSmoke {
            0% { opacity: 0.8; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(3); }
        }

        /* UI Elements */
        .message-container {
            margin-top: 40px;
            text-align: center;
            height: 100px;
        }

        h1 {
            color: #fff;
            font-family: 'Pacifico', cursive;
            font-size: 3.5rem;
            margin: 0;
            opacity: 0;
            transform: translateY(20px);
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            transition: all 1s ease 0.5s;
        }

        h1.show {
            opacity: 1;
            transform: translateY(0);
        }

        body.party-mode h1 {
            color: #ff3366;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(0,0,0,0.1);
        }

        .instruction {
            color: #a082a8;
            font-size: 1.2rem;
            margin-top: 10px;
            transition: opacity 0.5s ease;
        }

        .instruction.hide {
            opacity: 0;
        }

        .btn {
            background: #ff5e7e;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.2rem;
            font-family: 'Fredoka One', cursive;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(255, 94, 126, 0.4);
            transition: all 0.2s ease;
            position: relative;
            z-index: 10;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 94, 126, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }
        
        @media (max-width: 400px) {
            .cake-wrapper { transform: scale(0.8); }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>

    <div class="container">
        <div class="cake-wrapper" id="cake" title="Click to blow out the candles!">
            
            <div class="candles">
                <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
                <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
                <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
                <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
                <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
            </div>

            <div class="tier tier-top">
                <div class="drips">
                    <div class="drip"></div><div class="drip"></div><div class="drip"></div>
                    <div class="drip"></div><div class="drip"></div>
                </div>
            </div>
            <div class="tier tier-middle">
                <div class="drips">
                    <div class="drip"></div><div class="drip"></div><div class="drip"></div>
                    <div class="drip"></div><div class="drip"></div><div class="drip"></div>
                    <div class="drip"></div>
                </div>
            </div>
            <div class="tier tier-bottom">
                <div class="drips">
                    <div class="drip"></div><div class="drip"></div><div class="drip"></div>
                    <div class="drip"></div><div class="drip"></div><div class="drip"></div>
                    <div class="drip"></div><div class="drip"></div><div class="drip"></div>
                </div>
            </div>
            
            <div class="plate"></div>
        </div>

        <div class="message-container">
            <h1 id="wishText">Happy Birthday Fizamol! 🎵</h1>
            <p class="instruction" id="instruction"></p>
        </div>

        <button class="btn" id="blowBtn">Blow Out Candles! 🎂</button>
    </div>

    <script>
        // --- Audio Context for generating Birthday Melody ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(frequency, startTime, duration) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'triangle'; // Sounds a bit like a toy piano/music box
            oscillator.frequency.value = frequency;
            
            // Volume envelope to avoid audio clipping/popping
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(0.5, startTime + 0.05);
            gainNode.gain.setValueAtTime(0.5, startTime + duration - 0.05);
            gainNode.gain.linearRampToValueAtTime(0, startTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
        }

        function playHappyBirthday() {
            // Resume context if browser suspended it
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            // Frequencies for the notes
            const C4 = 261.63, D4 = 293.66, E4 = 329.63, F4 = 349.23;
            const G4 = 392.00, A4 = 440.00, Bb4 = 466.16, C5 = 523.25;
            
            // Note sequence and duration (in beats)
            const melody = [
                { f: C4, d: 0.25 }, { f: C4, d: 0.25 }, { f: D4, d: 0.5 }, { f: C4, d: 0.5 }, { f: F4, d: 0.5 }, { f: E4, d: 1.0 },
                { f: C4, d: 0.25 }, { f: C4, d: 0.25 }, { f: D4, d: 0.5 }, { f: C4, d: 0.5 }, { f: G4, d: 0.5 }, { f: F4, d: 1.0 },
                { f: C4, d: 0.25 }, { f: C4, d: 0.25 }, { f: C5, d: 0.5 }, { f: A4, d: 0.5 }, { f: F4, d: 0.5 }, { f: E4, d: 0.5 }, { f: D4, d: 1.0 },
                { f: Bb4, d: 0.25 }, { f: Bb4, d: 0.25 }, { f: A4, d: 0.5 }, { f: F4, d: 0.5 }, { f: G4, d: 0.5 }, { f: F4, d: 1.0 }
            ];

            let startTime = audioCtx.currentTime;
            const tempo = 0.9; // Speed of the song
            
            melody.forEach(note => {
                if (note.f) {
                    playTone(note.f, startTime, note.d * tempo);
                }
                startTime += note.d * tempo;
            });
        }


        // --- Interactions and Logic ---
        const cake = document.getElementById('cake');
        const blowBtn = document.getElementById('blowBtn');
        const flames = document.querySelectorAll('.flame');
        const candles = document.querySelectorAll('.candle');
        const wishText = document.getElementById('wishText');
        const instruction = document.getElementById('instruction');
        const body = document.body;
        let blownOut = false;

        function blowOutCandles() {
            if (blownOut) return;
            blownOut = true;

            // Blow out flames and add smoke
            flames.forEach(flame => {
                flame.classList.add('blown-out');
            });
            candles.forEach(candle => {
                candle.classList.add('blown');
            });

            // UI updates
            blowBtn.style.display = 'none';
            instruction.classList.add('hide');
            
            // Generate and Play Music!
            playHappyBirthday();

            // Switch to party mode after a brief delay
            setTimeout(() => {
                body.classList.add('party-mode');
                wishText.classList.add('show');
                startConfetti();
            }, 600);
        }

        cake.addEventListener('click', blowOutCandles);
        blowBtn.addEventListener('click', blowOutCandles);

        // --- Confetti System ---
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const colors = ['#ff5e7e', '#ffb703', '#00bbf9', '#00f5d4', '#f15bb5', '#9b5de5'];

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 8 + 5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.speedY = Math.random() * 3 + 2;
                this.speedX = Math.random() * 4 - 2;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 10 - 5;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotationSpeed;

                if (this.y > canvas.height) {
                    this.y = -20;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        let animationId;
        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            animationId = requestAnimationFrame(animateConfetti);
        }

        function startConfetti() {
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle());
            }
            animateConfetti();
        }
    </script>
</body>
</html>
